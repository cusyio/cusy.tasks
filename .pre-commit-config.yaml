# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks


ci:
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
    - id: trailing-whitespace
      exclude: tests/cli/test_list.py
    - id: end-of-file-fixer
    - id: check-yaml
      types: [file]
      files: \.(yml|yaml|cff)$
    - id: check-added-large-files
    - id: check-toml
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 59e7b26529dc6f15c43063064b8b06ded60d0910 # frozen: v2.29.4
    hooks:
    - id: pyproject-fmt
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 17e12779811926f000bdfa1795f9e3735dd71ac3 # frozen: 0.26
    hooks:
    - id: validate-pyproject
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 5403c16080c62d2568b9adab14249214641a9d1a # frozen: 0.12.21
    hooks:
    - id: uv-audit
      files: ^(uv\.lock|pyproject\.toml)$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd # frozen: v0.16.9
    hooks:
    - id: ruff-check
      args: [--fix, --exit-non-zero-on-fix]
      exclude: docs
    - id: ruff-format
  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: c883505f64b59c3c5c9375191e4ad9f98e727ccd # v1.0.2
    hooks:
    - id: sphinx-lint
      args: [--jobs=1]
      types: [rst]
  - repo: https://github.com/econchick/interrogate
    rev: 4894019dc8876092bc9b6d56878798c550fad998 # 1.7.0
    hooks:
    - id: interrogate
      args: [--quiet, --fail-under=100]
      pass_filenames: false
  - repo: https://github.com/fsfe/reuse-tool
    rev: a1bb792acda6fd0724936b4ebbdbc8eceb9c0459 # v6.2.0
    hooks:
    - id: reuse
      args: ["lint"]
