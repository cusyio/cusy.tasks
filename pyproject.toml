[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.10.2" ]

[project]
name = "cusy-tasks"
version = "26.2.0"
description = ""
readme = "README.rst"
license = "BSD-3-Clause"
license-files = [ "LICENSES/BSD-3-Clause.txt" ]
authors = [
  { name = "Veit Schiele", email = "veit@cusy.io" },
]
requires-python = ">=3.10"
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading",
]
dependencies = [
  "rich",
  "tinydb<4.9",
  "typer",
]
urls.Documentation = "https://tasks.cusy.io/"
urls.GitHub = "https://github.com/cusyio/cusy.tasks"
urls.Mastodon = "https://mastodon.social/@Python4DataScience"
scripts."cusy.tasks" = "cusy.tasks:app"

[dependency-groups]
dev = [
  "pre-commit",
  "reuse",
  "tox-uv>=1.16",
  "watchgha",
  { include-group = "docs" },
  { include-group = "tests" },
]
docs = [
  "furo",
  "interrogate",
  "matplotlib",
  "sphinx-copybutton",
  "sphinx-inline-tabs",
  "sphinxcontrib-napoleon",
  "sphinxext-opengraph",
]
tests = [
  "coverage[toml]",
  "faker",
  "pytest>=9",
  "pytest-cov",
]

[tool.uv]
exclude-newer = "P3D"  # "3 days" in RFC 3339 format
build-backend.module-name = "cusy.tasks"

[tool.ruff]
line-length = 79
src = [ "src", "tests" ]
lint.select = [ "ALL" ]
lint.ignore = [
  "A",      # Shaddowing is fine
  "ANN",    # We don’t use type annotations
  "B008",   # Function call `typer.Option` in argument defaults is fine
  "COM812", # May cause conflicts when used with the formatter
  "CPY001", # Reuse already checks copyright information
  "INP001", # docs/conf.py is a Python file outside of packages
  "RUF001", # I love typographic symbols
  "RUF003", # Ditto
  "T201",   # print is fine
]
lint.per-file-ignores."docs/conf.py" = [
  "S605", # Starting a process with a shell: seems safe, but may be changed in the future; consider rewriting without `shell`
  "S606", # Starting a process with a partial executable path
]
lint.per-file-ignores."tests/*" = [
  "ARG001",  # With monkeypatch, seemingly unused arguments are used
  "PLR2004", # Numbers are sometimes fine in tests
  "S101",    # assert in tests is fine
  "W291",    # To test the output on the CLI, trailing spaces are needed
]
lint.isort.lines-after-imports = 2
lint.isort.lines-between-types = 1
lint.pydocstyle.convention = "google"

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-regex = []
exclude = [ "docs" ]
color = true
verbose = 0
quiet = false
omit-covered-files = false
whitelist-regex = []

[tool.pytest]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
]
markers = [
  "exception: Only run expected exceptions",
  "finish: Only run finish tests",
  "smoke: Small subset of all tests",
  "num_tasks: Number of tasks to be pre-filled for the tasks_db fixture",
]
minversion = "9.0"
testpaths = [
  "tests",
]

[tool.coverage]
run.source = [ "src", "tests" ]
run.branch = true
run.parallel = true
paths.source = [ "src", ".tox/py*/**/site-packages" ]
report.exclude_lines = [
  "if __name__ == .__main__.:",
  "no cov",
]
report.skip_covered = true
report.show_missing = true

[tool.tox]
requires = [ "tox>=4.51" ]
env_list = [
  "3.1{0-5}",
  "3.1{3-5}t",
  "coverage-report",
  "docs",
  "pre-commit",
]
package_env = "True"
skip_missing_interpreters = true
env.coverage-report.description = "Report coverage over all test runs."
env.coverage-report.skip_install = true
env.coverage-report.deps = [ "coverage[toml]" ]
env.coverage-report.commands = [
  [ "coverage", "combine" ],
  [ "coverage", "report" ],
]
env.docs.base_python_file = ".python-version"
env.docs.deps = [ "interrogate" ]
env.docs.dependency_groups = [ "docs" ]
env.docs.commands = [
  [ "sphinx-build", "-n", "-T", "-W", "-b", "html", "-d", "{envtmpdir}/doctrees", "docs", "docs/_build/html" ],
  [ "sphinx-build", "-n", "-T", "-W", "-b", "doctest", "-d", "{envtmpdir}/doctrees", "docs", "docs/_build/html" ],
  [ "interrogate", "--quiet", "--fail-under", "100", "src", "tests" ]
]
env.docs-linkcheck.base_python_file = [ "{[tool.tox.env.docs]base_python_file}" ]
env.docs-linkcheck.dependency_groups = [ "docs" ]
env.docs-linkcheck.commands = [
  [ "sphinx-build", "-W", "-b", "linkcheck", "-d", "{envtmpdir}/doctrees", "docs", "docs/_build/html" ]
]
env.pre-commit.description = "Run all pre-commit hooks."
env.pre-commit.skip_install = true
env.pre-commit.deps = [
  "pre-commit",
]
env.pre-commit.commands = [
  [ "pre-commit", "run", "--all-files" ],
]
env_run_base.deps = [ "coverage[toml]" ]
env_run_base.dependency_groups = [ "tests" ]
env_run_base.commands = [
  [ "python", "--version", "--version" ],
  [ "coverage", "run", "-m", "pytest", "{posargs}" ],
]
